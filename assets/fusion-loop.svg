<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="t d">
  <title id="t">The fusion loop: predict, innovate, gate, update or reject</title>
  <desc id="d">Relative motion from VIO drives the prediction. Each absolute fix produces an innovation and a squared Mahalanobis distance. A fix inside the 99 percent chi-square gate updates the estimate; a fix outside it is rejected and logged while the estimate coasts on VIO. The inset shows a fix with d squared 1.44 accepted and one with 11.1 rejected.</desc>
  <style>
    .serif { font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif; }
    .sans { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .node { fill: #FFFFFF; stroke: #DAD6CC; stroke-width: 1.5; }
    .edge { fill: none; stroke: #5B7083; stroke-width: 1.75; }
    .loop { fill: none; stroke: #1F3A5F; stroke-width: 1.75; stroke-dasharray: 6 6; animation: dash 2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    .gate { animation: gate 8s linear infinite; }
    @keyframes gate { 0%, 22% { fill: #FFFFFF; stroke: #1F3A5F; } 25%, 45% { fill: #EAF0EB; stroke: #5E7F68; } 48%, 72% { fill: #FFFFFF; stroke: #1F3A5F; } 75%, 94% { fill: #F6E9E6; stroke: #A33A2B; } 97%, 100% { fill: #FFFFFF; stroke: #1F3A5F; } }
    .upd { animation: upd 8s linear infinite; }
    @keyframes upd { 0%, 36% { stroke: #DAD6CC; } 40%, 50% { stroke: #5E7F68; } 56%, 100% { stroke: #DAD6CC; } }
    .rej { animation: rej 8s linear infinite; }
    @keyframes rej { 0%, 86% { stroke: #DAD6CC; } 90%, 97% { stroke: #A33A2B; } 100% { stroke: #DAD6CC; } }
    .tok1 { animation: tok1 8s linear infinite; }
    @keyframes tok1 { 0% { transform: translate(0, 0); opacity: 1; } 23% { transform: translate(420px, 0); } 33% { transform: translate(420px, -180px); } 40% { transform: translate(540px, -180px); opacity: 1; } 44%, 100% { transform: translate(540px, -180px); opacity: 0; } }
    .tok2 { opacity: 0; animation: tok2 8s linear infinite; }
    @keyframes tok2 { 0%, 49% { transform: translate(0, 0); opacity: 0; } 50% { transform: translate(0, 0); opacity: 1; } 73% { transform: translate(420px, 0); } 82% { transform: translate(420px, 150px); } 90% { transform: translate(540px, 150px); opacity: 1; } 95%, 100% { transform: translate(540px, 150px); opacity: 0; } }
    .in1 { animation: in1 8s linear infinite; }
    @keyframes in1 { 0%, 22% { opacity: .35; } 25%, 45% { opacity: 1; } 50%, 100% { opacity: .35; } }
    .in2 { animation: in2 8s linear infinite; }
    @keyframes in2 { 0%, 72% { opacity: .35; } 75%, 95% { opacity: 1; } 100% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .tok1, .tok2 { opacity: 0; } .in1, .in2 { opacity: 1; } }
  </style>
  <rect width="1000" height="560" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="999" height="559" fill="none" stroke="#DAD6CC"/>
  <rect x="0" y="0" width="1000" height="3" fill="#1F3A5F"/>
  <text x="40" y="38" class="mono" font-size="12" letter-spacing="1.2" fill="#7A8088">FIGURE 1 · ONE FILTER STEP, TWO OUTCOMES</text>
  <text x="40" y="64" class="serif" font-size="22" font-weight="600" fill="#1B1F24">The fusion loop: the absolute source proposes, the estimator disposes</text>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B7083"/></marker>
    <marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/></marker>
  </defs>

  <!-- edges -->
  <path class="edge" d="M240 135 H316" marker-end="url(#ah)"/>
  <path class="edge" d="M430 170 V246" marker-end="url(#ah)"/>
  <path class="edge" d="M240 315 H316" marker-end="url(#ah)"/>
  <path class="edge" d="M540 315 H594" marker-end="url(#ah)"/>
  <path class="edge" d="M660 253 V135 H776" marker-end="url(#ah)"/>
  <path class="edge" d="M660 377 V465 H776" marker-end="url(#ah)"/>
  <path class="loop" d="M875 100 V84 H430 V96" marker-end="url(#ahn)"/>
  <text x="652" y="78" text-anchor="middle" class="mono" font-size="12" fill="#1F3A5F">next step</text>
  <text x="438" y="214" class="mono" font-size="12" fill="#7A8088">x̂⁻, P⁻</text>
  <text x="668" y="200" class="mono" font-size="12" fill="#5E7F68">inside gate</text>
  <text x="668" y="430" class="mono" font-size="12" fill="#A33A2B">outside gate</text>

  <!-- nodes -->
  <rect class="node" x="40" y="100" width="200" height="70" rx="4"/>
  <text x="56" y="128" class="sans" font-size="15" font-weight="600" fill="#1B1F24">VIO / IMU</text>
  <text x="56" y="150" class="sans" font-size="12.5" fill="#4A5058">relative motion: smooth, drifts</text>

  <rect class="node" x="320" y="100" width="220" height="70" rx="4" stroke="#1F3A5F"/>
  <text x="336" y="128" class="sans" font-size="15" font-weight="600" fill="#1B1F24">Predict</text>
  <text x="336" y="150" class="mono" font-size="12" fill="#4A5058">P⁻ = F P Fᵀ + Q</text>

  <rect class="node" x="40" y="280" width="200" height="70" rx="4"/>
  <text x="56" y="308" class="sans" font-size="15" font-weight="600" fill="#1B1F24">Absolute fix z</text>
  <text x="56" y="330" class="sans" font-size="12.5" fill="#4A5058">VPR or GNSS: no drift, can lie</text>

  <rect class="node" x="320" y="280" width="220" height="70" rx="4"/>
  <text x="336" y="308" class="sans" font-size="15" font-weight="600" fill="#1B1F24">Innovation</text>
  <text x="336" y="330" class="mono" font-size="12" fill="#4A5058">y = z − h(x̂⁻), S = HP⁻Hᵀ+R</text>

  <path class="gate" d="M660 253 L722 315 L660 377 L598 315 Z" stroke-width="2"/>
  <text x="660" y="309" text-anchor="middle" class="mono" font-size="12" fill="#1B1F24">d² = yᵀS⁻¹y</text>
  <text x="660" y="327" text-anchor="middle" class="mono" font-size="12" fill="#1B1F24">≤ 9.21 ?</text>

  <rect class="node upd" x="780" y="100" width="190" height="70" rx="4" stroke-width="2"/>
  <text x="796" y="128" class="sans" font-size="15" font-weight="600" fill="#1B1F24">Update</text>
  <text x="796" y="150" class="mono" font-size="12" fill="#4A5058">x̂ = x̂⁻ + K y</text>

  <rect class="node rej" x="780" y="430" width="190" height="70" rx="4" stroke-width="2"/>
  <text x="796" y="458" class="sans" font-size="15" font-weight="600" fill="#1B1F24">Reject and log</text>
  <text x="796" y="480" class="sans" font-size="12.5" fill="#4A5058">estimate coasts on VIO</text>

  <!-- tokens: start at the fix node edge (240, 315) -->
  <circle class="tok1" cx="240" cy="315" r="7" fill="#5E7F68"/>
  <circle class="tok2" cx="240" cy="315" r="7" fill="#A33A2B"/>

  <!-- inset: the gate in the innovation plane, 1 px = 1 m -->
  <rect x="40" y="388" width="520" height="140" rx="4" fill="#F6F4EF" stroke="#DAD6CC"/>
  <text x="56" y="410" class="mono" font-size="11" letter-spacing="1" fill="#7A8088">INNOVATION PLANE · S = diag(15², 15²) m² · 1 px = 1 m</text>
  <line x1="80" y1="470" x2="200" y2="470" stroke="#DAD6CC"/>
  <line x1="140" y1="420" x2="140" y2="520" stroke="#DAD6CC"/>
  <circle cx="140" cy="470" r="45.5" fill="#E8EDF3" fill-opacity=".7" stroke="#1F3A5F" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g class="in1">
    <circle cx="150" cy="485" r="5" fill="#5E7F68"/>
    <text x="230" y="452" class="mono" font-size="12" fill="#5E7F68">y = [10, −15] m → d² = 1.44 accepted</text>
  </g>
  <g class="in2">
    <path d="M165 425 l10 10 m0 -10 l-10 10" stroke="#A33A2B" stroke-width="2"/>
    <text x="230" y="476" class="mono" font-size="12" fill="#A33A2B">y = [30, 40] m → d² = 11.1 rejected</text>
  </g>
  <text x="230" y="500" class="sans" font-size="12" fill="#4A5058">Gate radius √9.21 × 15 = 45.5 m. A 2 km jump gives d² ≈ 17,800.</text>
</svg>
