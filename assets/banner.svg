<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">GNSS-Denied Navigation Primer</title>
  <desc id="d">Banner: a drifting dead-reckoning track, the true track, and an estimate whose gate accepts a nearby fix and rejects a distant one.</desc>
  <style>
    .display { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -0.01em; }
    .sans { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .drift { stroke-dasharray: 360; stroke-dashoffset: 360; animation: draw 8s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 360; } 60%, 100% { stroke-dashoffset: 0; } }
    .est { animation: move 8s linear infinite; }
    @keyframes move { 0% { transform: translate(0, 0); } 100% { transform: translate(300px, -140px); } }
    .okfix { opacity: 0; animation: ok 8s linear infinite; }
    @keyframes ok { 0%, 30% { opacity: 0; } 34%, 48% { opacity: 1; } 56%, 100% { opacity: 0; } }
    .badfix { opacity: 0; animation: bad 8s linear infinite; }
    @keyframes bad { 0%, 62% { opacity: 0; } 66%, 82% { opacity: 1; } 90%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .okfix, .badfix { opacity: 1; } .drift { stroke-dashoffset: 0; } }
  </style>
  <rect width="1200" height="400" fill="#F5F7FA"/>
  <rect x="0.5" y="0.5" width="1199" height="399" fill="none" stroke="#D8DEE6"/>
  <text x="64" y="76" class="mono" font-size="13" letter-spacing="2.2" fill="#5F6B7C">DARKANALYTICA</text>
  <rect x="64" y="112" width="56" height="3" fill="#0B2545"/>
  <text x="64" y="180" class="display" font-size="46" font-weight="600" fill="#0E1726">GNSS-Denied Navigation Primer</text>
  <text x="64" y="222" class="sans" font-size="19" fill="#3D4A5C">Jamming versus spoofing, drifting odometry, absolute fixes,</text>
  <text x="64" y="250" class="sans" font-size="19" fill="#3D4A5C">and an estimator that refuses fixes it cannot believe.</text>
  <text x="64" y="326" class="mono" font-size="12" letter-spacing="1" fill="#5F6B7C">VIO · VPR · EKF · χ² GATING · CARRY-OFF · RMSE · CEP · NEES</text>

  <!-- map strip -->
  <g>
    <!-- truth -->
    <line x1="830" y1="300" x2="1130" y2="160" stroke="#0E1726" stroke-width="1.5" stroke-dasharray="2 5"/>
    <!-- drifting VIO -->
    <path class="drift" d="M830 300 C 930 262, 1030 238, 1140 236" fill="none" stroke="#3E5C76" stroke-width="1.75"/>
    <text x="1138" y="256" text-anchor="end" class="mono" font-size="11" fill="#3E5C76">VIO drifts</text>
    <text x="1130" y="146" text-anchor="end" class="mono" font-size="11" fill="#0E1726">truth</text>
    <!-- fused estimate with gate -->
    <g class="est">
      <circle cx="830" cy="300" r="34" fill="#EDF1F6" fill-opacity=".6" stroke="#0B2545" stroke-width="1.5" stroke-dasharray="4 3"/>
      <circle cx="830" cy="300" r="5" fill="#0B2545"/>
    </g>
    <!-- accepted fix: near the estimate at ~40 % of the track -->
    <g class="okfix">
      <circle cx="958" cy="236" r="5" fill="#2F6F73"/>
      <text x="966" y="222" class="mono" font-size="11" fill="#2F6F73">d² 1.4 accepted</text>
    </g>
    <!-- rejected fix: far outside the gate at ~75 % of the track -->
    <g class="badfix">
      <path d="M1040 300 l10 10 m0 -10 l-10 10" stroke="#8A6A1F" stroke-width="2"/>
      <text x="1058" y="312" class="mono" font-size="11" fill="#8A6A1F">d² 11.1 rejected</text>
    </g>
    <circle cx="830" cy="300" r="3" fill="#0E1726"/>
  </g>
</svg>
